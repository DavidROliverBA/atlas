name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests (core, stencils, ai, cli, storage)
        run: pnpm -r test --filter '!@atlas/web'
      - name: Install Playwright browsers
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @atlas/web test
        env:
          CI: "true"
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  deploy:
    # Deploys only when the CLOUDFLARE_API_TOKEN repo secret is configured;
    # otherwise the job succeeds with a notice so CI stays green.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping deploy (add it in repo settings to enable auto-deploy)"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.present == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.present == 'true'
      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: pnpm --filter @atlas/web build
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.present == 'true'
        run: pnpm --filter @atlas/web exec wrangler pages deploy dist --project-name atlas-modelling --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: edc54adeeb89138ef55778faa9306d2e
