name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Typecheck (web functions)
        run: pnpm --filter @atlas/web run typecheck:functions
      - name: Unit tests (core, stencils, ai, cli, storage)
        run: pnpm -r test --filter '!@atlas/web'
      - name: Unit tests (web functions)
        run: pnpm --filter @atlas/web run test:functions

  e2e:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: End-to-end tests (shard ${{ matrix.shard }}/2)
        run: pnpm --filter @atlas/web test -- --shard=${{ matrix.shard }}/2
        env:
          CI: "true"
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7

  deploy:
    # Deploys only when the CLOUDFLARE_API_TOKEN repo secret is configured;
    # otherwise the job succeeds with a notice so CI stays green.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: e2e
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping deploy (add it in repo settings to enable auto-deploy)"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.present == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.present == 'true'
      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: pnpm --filter @atlas/web build
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.present == 'true'
        # Project name and build output dir come from apps/web/wrangler.toml.
        run: pnpm --filter @atlas/web exec wrangler pages deploy --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: edc54adeeb89138ef55778faa9306d2e

  preview:
    # PR preview deploys: same gate as the main deploy job, so a fork PR (no
    # secrets access) or a repo without CLOUDFLARE_API_TOKEN configured just
    # skips with a notice instead of failing CI.
    if: github.event_name == 'pull_request'
    needs: e2e
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set — skipping PR preview deploy (add it in repo settings to enable)"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.present == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.present == 'true'
      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: pnpm --filter @atlas/web build
      - name: Deploy PR preview to Cloudflare Pages
        if: steps.creds.outputs.present == 'true'
        # Project name and build output dir come from apps/web/wrangler.toml.
        # Branch alias names the preview; Pages URLs it as <branch>.<project>.pages.dev.
        run: pnpm --filter @atlas/web exec wrangler pages deploy --branch "pr-${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: edc54adeeb89138ef55778faa9306d2e
